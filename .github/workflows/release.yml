name: Release

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write

# Serialize master runs: the "does this release exist yet" check and the create
# that follows it are not atomic, so two merges landing close together could both
# pass the check and the second would fail on create. cancel-in-progress stays
# false - killing a run mid-publish is worse than waiting.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      run: cargo test --release --verbose
    - name: Build release binary
      run: cargo build --release --verbose
    # ponytail: version lives in Cargo.toml, so a merge that bumps it publishes a release.
    # Every merge still tests and builds - it is only this step that no-ops when the
    # version is unchanged. No tagging step, no release-please.
    # target/release is mostly build cache (deps/, .fingerprint/, *.pdb) - ship only the exe.
    - name: Publish release if Cargo.toml version is new
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $tag = "v" + (Select-String '^version = "(.+)"' Cargo.toml).Matches[0].Groups[1].Value
        gh release view $tag *> $null
        if ($LASTEXITCODE -eq 0) { "Release $tag already exists - nothing to do"; exit 0 }
        $zip = "sideqm-$tag-windows-x64.zip"
        Compress-Archive -Path target/release/sideqm.exe, README.md -DestinationPath $zip
        gh release create $tag $zip target/release/sideqm.exe --target ${{ github.sha }} --generate-notes --title $tag
