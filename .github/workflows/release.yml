name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      run: cargo test --release --verbose
    - name: Build release binary
      run: cargo build --release --verbose
    # ponytail: target/release is mostly build cache (deps/, .fingerprint/, *.pdb).
    # Ship only what users run. Add more files here if the app ever gains bundled assets.
    - name: Package zip
      run: Compress-Archive -Path target/release/sideqm.exe, README.md -DestinationPath sideqm-${{ github.ref_name }}-windows-x64.zip
    - name: Create GitHub release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create "${{ github.ref_name }}" sideqm-${{ github.ref_name }}-windows-x64.zip target/release/sideqm.exe --generate-notes --title "${{ github.ref_name }}"
